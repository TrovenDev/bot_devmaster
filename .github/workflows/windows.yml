name: Windows — build e release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - name: Testar as regras do programa
        run: python -m unittest discover -s app -v
      - name: Validar a versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $versao = python -c "import runpy; print(runpy.run_path('app/versao.py')['VERSION'])"
          if ($env:GITHUB_REF_NAME -ne "v$versao") { throw "A tag $env:GITHUB_REF_NAME deve ser igual a v$versao (app/versao.py)" }
      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Gerar o executável e o instalador
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: DevMasterBot-Windows
          path: |
            dist/DevMasterBot.exe
            dist/BotDevMaster-Setup.exe
            dist/SHA256SUMS.txt
      - name: Publicar a release (atualização automática)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Esta versão já foi publicada.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME dist/DevMasterBot.exe dist/BotDevMaster-Setup.exe dist/SHA256SUMS.txt --title "Bot DevMaster $env:GITHUB_REF_NAME" --generate-notes --verify-tag
